aid: citymall
name: CityMall
description: 'CityMall is an Indian social-commerce and e-commerce platform operated by Rashanbox
  Retail Private Limited (CIN U52190HR2020PTC086114), serving Tier-2 and Tier-3 towns through a
  community-group-buying model. Customers shop across groceries, staples, fashion, electronics,
  home and kitchen, beauty and health, kids and toys, and books and stationery, with cash-on-delivery
  and free-delivery options via web and native Android/iOS apps. The company runs on modern web
  infrastructure (CloudFront CDN, next-gen image optimization) and is backed by Accel, General
  Catalyst, and Norwest Venture Partners. No public developer API, portal, or documentation surface
  is currently published; this profile captures the company identity and its verified domain-security
  posture.'
